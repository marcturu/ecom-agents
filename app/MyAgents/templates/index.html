<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Agent</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2c2c2c;
            color: #f8f9fa;
        }

        .container {
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
        }

        .form-control {
            background-color: #495057;
            color: #f8f9fa;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            background-color: #495057;
            color: #f8f9fa;
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0069d9;
            border-color: #0062cc;
        }

        h1,
        h2 {
            color: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Interface Agent</h1>

        <h2>Dispatch Product</h2>
        <form action="/dispatch" method="post" class="mb-5">
            <div class="form-group">
                <label for="product_name">Product Name:</label>
                <input type="text" id="product_name" name="product_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="delivery_address">Delivery Address:</label>
                <input type="text" id="delivery_address" name="delivery_address" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="delivery_city">Delivery City:</label>
                <input type="text" id="delivery_city" name="delivery_city" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Dispatch Product</button>
        </form>

        <h2>Register Product</h2>
        <form action="/register_product" method="post">
            <div class="form-group">
                <label for="target_agent_name">Target Agent Name:</label>
                <input type="text" id="target_agent_name" name="target_agent_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="product_name">Product Name:</label>
                <input type="text" id="product_name" name="product_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="product_id">Product ID:</label>
                <input type="text" id="product_id" name="product_id" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="product_price">Product Price:</label>
                <input type="text" id="product_price" name="product_price" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="stock_quantity">Stock Quantity:</label>
                <input type="number" id="stock_quantity" name="stock_quantity" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Register Product</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
