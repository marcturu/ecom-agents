<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dispatch Product</title>
</head>

<body>
    <h1>Dispatch Product</h1>
    <form action="/dispatch" method="post">
        <label for="product_name">Product Name:</label>
        <input type="text" id="product_name" name="product_name" required><br><br>
        <label for="delivery_address">Delivery Address:</label>
        <input type="text" id="delivery_address" name="delivery_address" required><br><br>
        <label for="delivery_city">Delivery City:</label>
        <input type="text" id="delivery_city" name="delivery_city" required><br><br>
        <input type="submit" value="Dispatch">
    </form>
</body>

</html>
