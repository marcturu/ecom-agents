<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Interaction Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .agent {
            margin-bottom: 20px;
        }

        .response {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>

<body>
    <h1>Agent Interaction Interface</h1>
    <div id="agents"></div>

    <script>
        async function fetchAgents() {
            const response = await fetch('/GetAgents');
            const agents = await response.json();
            const agentsDiv = document.getElementById('agents');

            for (const [name, address] of Object.entries(agents)) {
                const agentDiv = document.createElement('div');
                agentDiv.className = 'agent';

                const title = document.createElement('h2');
                title.textContent = name;
                agentDiv.appendChild(title);

                const requestButton = document.createElement('button');
                requestButton.textContent = 'Send Product Info Request';
                requestButton.onclick = () => sendRequest(name, address);
                agentDiv.appendChild(requestButton);

                const responseDiv = document.createElement('div');
                responseDiv.className = 'response';
                agentDiv.appendChild(responseDiv);

                agentsDiv.appendChild(agentDiv);
            }
        }

        async function sendRequest(agentName, agentAddress) {
            const response = await fetch(agentAddress, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    type: 'request',
                    performative: 'infoProd',
                    product: 'Laptop'
                })
            });

            const responseData = await response.json();
            const responseDiv = document.querySelector(`.agent h2:contains(${agentName})`).nextElementSibling.nextElementSibling;
            responseDiv.textContent = `Received response: ${JSON.stringify(responseData)}`;
        }

        fetchAgents();
    </script>
</body>

</html>
