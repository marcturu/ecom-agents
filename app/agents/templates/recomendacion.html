<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto Recomendado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .product-card {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
            max-width: 600px;
            margin: auto;
        }
        .product-card h2 {
            margin-top: 0;
        }
        .product-card p {
            margin: 5px 0;
        }
        .product-card .price {
            font-size: 1.5em;
            color: green;
        }
        .product-card .rating {
            color: gold;
        }
    </style>
</head>
<body>
<div class="product-card">
    <h2>{{ producto.nombre }}</h2>
    <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
    <p class="price"><strong>Precio:</strong> {{ producto.precio }} €</p>
    <p><strong>Descripción:</strong> {{ producto.descripcion }}</p>
    <p><strong>Número de Valoraciones:</strong> {{ producto.num_valoraciones }}</p>
    <p class="rating"><strong>Estrellas Medias:</strong> {{ producto.estrellas_mitges }} ★</p>
</div>
</body>
</html>
